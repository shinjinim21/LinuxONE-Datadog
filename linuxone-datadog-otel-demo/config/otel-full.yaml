# OpenTelemetry Collector config: host metrics, node_exporter, CockroachDB and
# the cockroach workload load generator (Part 5.3).
# Copy to /etc/otelcol-contrib/config.yaml. DD_API_KEY and DD_SITE come from
# /etc/otelcol-contrib/otelcol-contrib.conf.
receivers:
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load: {}
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      network: {}
      paging: {}
  prometheus:
    config:
      scrape_configs:
        - job_name: linuxone-node
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:9100']
        - job_name: cockroachdb
          scrape_interval: 15s
          metrics_path: /_status/vars
          static_configs:
            - targets: ['localhost:8080']
        - job_name: crdb-workload
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:2112']

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 80
  resourcedetection:
    detectors: [system]
  batch: {}

exporters:
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, prometheus]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [datadog]
